name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cacheer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Metadata, security, style, and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Audit resolved dependencies
        run: composer audit

      - name: Check code style
        run: composer lint

      - name: Run PHPStan
        run: composer analyse

  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run service-free test suite
        run: composer test:unit
        env:
          DB_CONNECTION: sqlite

      - name: Run store contracts
        run: composer test:contract
        env:
          DB_CONNECTION: sqlite

      - name: Run v6 kernel tests
        run: composer test:kernel

      - name: Run v6 storage pipeline tests
        run: composer test:storage

  parallel:
    name: Parallel isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run service-free tests in parallel
        run: composer test:parallel
        env:
          DB_CONNECTION: sqlite

  lowest-dependencies:
    name: Lowest supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, openssl, zlib
          coverage: none

      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Run unit and contract suites
        run: |
          composer test:unit
          composer test:contract
          composer test:kernel
          composer test:storage
        env:
          DB_CONNECTION: sqlite

  release-rehearsal:
    name: Fresh-install & v5-upgrade rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP (core only, no optional extensions)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install runtime only (no dev, no optional backends)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Fresh install runs with zero optional dependencies
        run: |
          php Examples/v6/01-quick-start.php
          php Examples/v6/02-scopes-and-observability.php

      - name: Install dev tooling
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run fresh-install and v5-upgrade rehearsal suite
        run: composer test:kernel
        env:
          DB_CONNECTION: sqlite

  benchmark:
    name: Baseline benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run payload matrix
        run: |
          mkdir -p build/benchmarks
          composer benchmark:baseline > build/benchmarks/v5-baseline.json
        env:
          CACHEER_BENCH_DRIVERS: array,file
          CACHEER_BENCH_ITERATIONS: 100

      - name: Validate benchmark schema
        run: composer test:benchmark

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-baseline-${{ github.sha }}
          path: build/benchmarks/v5-baseline.json
          if-no-files-found: error

  redis:
    name: Redis / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Redis integration suite
        run: composer test:integration:redis
        env:
          CACHEER_REQUIRE_REDIS: '1'
          DB_CONNECTION: sqlite
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 0

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cacheer
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --password=secret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run MySQL integration suite
        run: composer test:integration:database
        env:
          CACHEER_REQUIRE_DATABASE: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cacheer
          DB_USERNAME: root
          DB_PASSWORD: secret

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cacheer
          POSTGRES_USER: cacheer
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=cacheer --dbname=cacheer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PostgreSQL integration suite
        run: composer test:integration:database
        env:
          CACHEER_REQUIRE_DATABASE: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: cacheer
          DB_USERNAME: cacheer
          DB_PASSWORD: secret
