name: Performance report
description: Report a performance problem.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the slowdown and include a reproducible example and your
        environment so others can investigate.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version and build, OS, CPU, store/backend and its version, and dataset size.
    validations:
      required: true
  - type: textarea
    id: methodology
    attributes:
      label: Methodology
      description: >
        Which operation is slow, how often it runs, and the relevant cache
        configuration.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Expected and observed behavior, including any measurements you already have.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A script or branch others can run to reproduce the problem.
    validations:
      required: true
